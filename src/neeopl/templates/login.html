{% extends "base.html" %}
{% block content %}

<div class="max-w-md mx-auto mt-12">
  <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-8">
    <h1 class="text-2xl font-semibold tracking-tight text-center mb-6">Вход</h1>
    {% if error %}
    <p class="mb-4 text-sm text-rose-500 text-center">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login" class="space-y-4">
      <label class="block text-sm">
        <span class="text-slate-600">Логин</span>
        <input name="username" type="text" required autofocus
               class="mt-1 w-full rounded-md border-slate-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400 outline-none"/>
      </label>
      <label class="block text-sm">
        <span class="text-slate-600">Пароль</span>
        <input name="password" type="password" required
               class="mt-1 w-full rounded-md border-slate-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400 outline-none"/>
      </label>
      <button class="w-full rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-500 transition">
        Войти
      </button>
    </form>
  </div>
</div>

{% endblock %}
