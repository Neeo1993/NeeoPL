<li class="px-5 py-3 text-sm fade-in" id="expense-row-{{ expense_id }}">
  <div class="flex items-center justify-between mb-3">
    <span class="text-slate-700 font-medium">История пополнений: {{ title }}</span>
    <button type="button"
            hx-get="/periods/{{ period_id }}/body"
            hx-target="#period-body" hx-swap="outerHTML"
            class="text-slate-300 hover:text-slate-500 transition text-xs">закрыть</button>
  </div>
  {% if additions %}
  <ul class="divide-y divide-slate-100 -mx-2">
    {% for a in additions %}
    <li class="flex items-center justify-between px-2 py-2 text-xs">
      <span class="text-slate-500">{{ a.created_at.strftime('%d.%m.%Y %H:%M') }}</span>
      <b class="text-emerald-600">{{ a.amount | money }}</b>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="text-xs text-slate-400 py-3 text-center">пополнений не было</p>
  {% endif %}
</li>
