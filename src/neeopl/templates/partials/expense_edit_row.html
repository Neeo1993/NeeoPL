<li class="px-5 py-3 text-sm fade-in" id="expense-row-{{ e.id }}">
  <form class="grid grid-cols-12 gap-2 items-center"
        hx-post="/expenses/{{ e.id }}" hx-target="#period-body" hx-swap="outerHTML">
    <input name="title" type="text" value="{{ e.title }}" required
           class="col-span-5 rounded-md border-slate-300 border px-2 py-1 text-sm focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400 outline-none"/>
    <input name="plan" type="number" step="0.01" min="0" value="{{ e.plan }}" required
           class="col-span-3 rounded-md border-slate-300 border px-2 py-1 text-sm focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400 outline-none"/>
    <input name="fact" type="number" step="0.01" min="0" value="{{ e.fact if e.fact != 0 else '' }}" placeholder="—"
           class="col-span-3 rounded-md border-slate-300 border px-2 py-1 text-sm focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400 outline-none"/>
    <button type="submit" class="col-span-1 rounded-md bg-emerald-600 text-white hover:bg-emerald-500 transition grid place-items-center" title="Сохранить">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </button>
    <button type="button"
           hx-get="/periods/{{ e.period_id }}/body"
           hx-target="#period-body" hx-swap="outerHTML"
           class="col-span-1 -ml-1 text-slate-300 hover:text-slate-500 transition grid place-items-center" title="Отмена">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </form>
</li>
