{% extends "base.html" %}
{% block content %}

<div class="flex items-center gap-3 mb-6">
  <a href="/" class="text-slate-400 hover:text-indigo-500 transition" title="Назад">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="flex-1">
    <h1 class="text-2xl font-semibold tracking-tight">{{ period.title }}</h1>
  </div>
  <form method="post" action="/periods/{{ period.id }}/delete"
        onsubmit="return confirm('Удалить период и все записи?')">
    {{ csrf_field(request) }}
    <button class="text-xs text-rose-500 hover:text-rose-700 border border-rose-200 hover:bg-rose-50 rounded-md px-2 py-1 transition">Удалить период</button>
  </form>
</div>

{% include "partials/period_body.html" %}

{% endblock %}
